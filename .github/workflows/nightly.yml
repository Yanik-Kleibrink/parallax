name: Nightly Deploy and Release

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

concurrency:
  group: nightly-deploy-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Cache Tikzjax Assets
        id: tikzjax-cache
        uses: actions/cache@v4
        with:
          path: |
            server/rust_tikz/src/assets/core.dump
            server/rust_tikz/src/assets/tex.wasm
            server/rust_tikz/src/assets/tex_files.tar.gz
            client/public/fonts.css
          key: tikzjax-assets-${{ hashFiles('prepare_assets.sh') }}

      - name: Generate Tikzjax Assets
        if: steps.tikzjax-cache.outputs.cache-hit != 'true'
        run: ./prepare_assets.sh

      - name: Install Dependencies & Build Client for Pages
        working-directory: client
        run: |
          npm ci
          npm run generate-icons
          BASE_PATH="/parallax/" npm run build

      - name: Build and Package Client for Pages
        working-directory: client
        run: |
          BASE_PATH="/parallax/" npm run build
          cd build
          tar -cJf ../../client-pages.tar.xz client

      - name: Build and Package Client for Release
        working-directory: client
        run: |
          npm run build
          cd build
          tar -cJf ../../client.tar.xz client

      - name: Package Server
        run: |
          tar -cJf server.tar.xz server

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          retention-days: 1
          path: |
            server.tar.xz
            client.tar.xz
            client-pages.tar.xz

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-archives

      - name: Extract Client Archive
        run: |
          tar -xf client-pages.tar.xz
          # This is a trick to make github pages work when directly
          # loading a dynamic route. In this case the server will open the
          # 404.html after which react router takes over as expected.
          cp client/index.html client/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
        
      - name: Upload Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  nightly-release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repo so git context exists
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag, Date, and Repo Context
        id: vars
        run: |
          TAG_NAME="nightly"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Update Nightly Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }} --force

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-archives

      - name: Checkout Parallax Demo Repo
        uses: actions/checkout@v4
        with:
          repository: 'Yanik-Kleibrink/parallax-demo'
          path: 'demo'

      - name: Package Parallax Demo Source
        run: |
          tar -cJf demo.tar.xz --exclude=".git" demo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Nightly Build (${{ steps.vars.outputs.date }})"
          body: |
            ### 🚀 Nightly Build (${{ steps.vars.outputs.date }})

            Automated development snapshot built directly from the main branch.

            ---

            ### 📦 Included Assets
            * **`client.tar.xz`**: Pre-built static client assets for self-hosting.
            * **`server.tar.xz`**: Backend server source package.

            ---

            ### 🌐 Deployed Services
            * **GitHub Pages Preview**: [View Live Deployment](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)
            * **Commit Reference**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ---

            ### 🛠️ Getting Started

            #### 1. Self-Hosting the Client
            Extract the client archive and serve it using a modern web server or reverse proxy (such as Caddy, Nginx, or Apache):
            ```sh
            tar -xf client.tar.xz
            # Serve the resulting directory with your web server of choice
            ```

            #### 2. Running the Server
            Build and launch the backend server in release mode:
            ```sh
            tar -xf server.tar.xz
            cd server
            cargo run --release -- [path to base]
            ```

            #### 3. Serving the Demo / Documentation
            Unzip the demo and launch the backend server:
            ```sh
            tar -xf demo.tar.xz
            cd server
            cargo run --release -- ../demo
            ```
          prerelease: true
          files: |
            client.tar.xz
            server.tar.xz
            demo.tar.xz
